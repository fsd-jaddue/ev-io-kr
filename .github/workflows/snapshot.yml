name: Refresh ev.or.kr snapshot

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "EV_PROBE=1 로 구조·네트워크 탐색만 수행"
        required: false
        default: "0"
  schedule:
    # 매시 20분 (UTC) → KST 06:20 ~ 23:20 사이만 실행 (21시~14시 UTC)
    - cron: "20 21-23,0-14 * * *"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Fetch snapshot from ev.or.kr
        id: fetch
        run: npm run fetch:snapshot
        timeout-minutes: 14
        env:
          CI: "1"
          EV_PROBE: ${{ github.event.inputs.probe || '0' }}
        continue-on-error: true

      - name: Upload debug html (when parsing failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-debug
          path: |
            data/snapshot/*.debug.html
            data/snapshot/*.debug.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit updated snapshot
        run: |
          git config user.name "ev-snapshot-bot"
          git config user.email "eviokr@icloud.com"
          git add data/snapshot/remain.json data/snapshot/local-price.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(snapshot): refresh ev.or.kr data $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push

      - name: Fail job if fetch failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "fetch:snapshot failed — see logs above and the snapshot-debug artifact"
          exit 1
