<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 204" width="800" height="204" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="204" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">전환지원금 100만원 받는 흐름</text><rect x="40" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="60" cy="86" r="12" fill="#059669"/><text x="60" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">내연기관차 보유</text><text x="120" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">본인 명의</text><text x="120" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">1년 이상 보유</text><path d="M204 108 h14.666666666666668" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><path d="M212.66666666666666 102 l8 6 -8 6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="226.66666666666666" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="246.66666666666666" cy="86" r="12" fill="#059669"/><text x="246.66666666666666" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="316.66666666666663" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">처분</text><text x="306.66666666666663" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">폐차(말소) 또는</text><text x="306.66666666666663" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">타인 양도(이전등록)</text><path d="M390.66666666666663 108 h14.666666666666668" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><path d="M399.3333333333333 102 l8 6 -8 6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="413.3333333333333" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="433.3333333333333" cy="86" r="12" fill="#059669"/><text x="433.3333333333333" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="503.3333333333333" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">전기차 구매·신청</text><text x="493.3333333333333" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">동일인 명의</text><text x="493.3333333333333" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">보조금 대상 차종</text><path d="M577.3333333333333 108 h14.666666666666668" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><path d="M585.9999999999999 102 l8 6 -8 6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="620" cy="86" r="12" fill="#f59e0b"/><text x="620" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="690" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">+100만원</text><text x="680" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">지급 신청 시</text><text x="680" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">처분 증빙 첨부</text><text x="400" y="188" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">처분 시점은 지자체 공고의 인정 기간(예: 신청 전 6개월 ~ 출고 후 2개월) 안에 있어야 함</text>
