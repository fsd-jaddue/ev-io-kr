<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 204" width="800" height="204" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="204" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">테슬라 국비가 낮아지는 세 가지 요인</text><rect x="40" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="60" cy="86" r="12" fill="#f59e0b"/><text x="60" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">가격계수 0.5</text><text x="120" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">모델 Y 프리미엄 LR</text><text x="120" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">기본가 5,300만원 초과</text><path d="M204 108 h108" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><path d="M306 102 l8 6 -8 6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="340" cy="86" r="12" fill="#0284c7"/><text x="340" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="410" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">LFP 배터리 계수</text><text x="400" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">효율·환경성 이중 감점</text><text x="400" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">스탠다드 트림</text><path d="M484 108 h108" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><path d="M586 102 l8 6 -8 6" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="66" width="160" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0"/><circle cx="620" cy="86" r="12" fill="#475569"/><text x="620" y="90" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="690" y="92" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">사후관리계수</text><text x="680" y="116" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">직영 정비망 부족</text><text x="680" y="132" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">전 트림 공통</text><text x="400" y="188" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">세 요인이 곱으로 작용하고, 지방비도 국비 비율에 비례해 함께 줄어듦</text>
</svg>
