<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="260" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">보조금 지급 전후 지켜야 할 기한</text><line x1="80" x2="720" y1="130" y2="130" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round"/><circle cx="80" cy="130" r="14" fill="#059669" stroke="#ffffff" stroke-width="4"/><text x="80" y="100" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">대상자 선정</text><text x="80" y="170" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">지자체 통보</text><text x="186.66666666666669" y="122" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">2개월 이내</text><circle cx="293.33333333333337" cy="130" r="14" fill="#059669" stroke="#ffffff" stroke-width="4"/><text x="293.33333333333337" y="100" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">출고·등록</text><text x="293.33333333333337" y="170" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">기한 초과 시</text><text x="293.33333333333337" y="188" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">선정 취소</text><text x="400" y="122" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">10일 이내</text><circle cx="506.6666666666667" cy="130" r="14" fill="#059669" stroke="#ffffff" stroke-width="4"/><text x="506.6666666666667" y="100" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">서류 제출</text><text x="506.6666666666667" y="170" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">지급 신청</text><text x="613.3333333333334" y="122" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">24개월</text><circle cx="720" cy="130" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/><text x="720" y="100" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">의무운행 종료</text><text x="720" y="170" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">이후 자유 처분</text><text x="400" y="244" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">의무운행기간 내 매각·타 시도 이전·폐차 시 잔여 개월 ÷ 24 비율로 환수</text>
</svg>
