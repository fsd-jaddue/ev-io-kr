<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 246" width="800" height="246" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="246" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">지자체 공고 물량은 이렇게 나뉩니다 (예시 1,500대)</text><text x="238" y="80" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">일반 (가장 빨리 소진)</text><rect x="250" y="66" width="438.0952380952381" height="22" rx="6" fill="#059669"/><text x="696.0952380952381" y="80" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">1,000대</text><text x="238" y="114" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">우선순위 (다자녀·취약계층·청년)</text><rect x="250" y="100" width="87.61904761904762" height="22" rx="6" fill="#7c3aed"/><text x="345.6190476190476" y="114" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">200대</text><text x="238" y="148" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">법인·기관 (사업장 기준)</text><rect x="250" y="134" width="65.71428571428571" height="22" rx="6" fill="#0284c7"/><text x="323.7142857142857" y="148" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">150대</text><text x="238" y="182" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">택시 (별도 국비 상한)</text><rect x="250" y="168" width="65.71428571428571" height="22" rx="6" fill="#f59e0b"/><text x="323.7142857142857" y="182" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">150대</text><text x="400" y="230" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">우선순위 물량이 남으면 일반으로 전환되는 것이 보통 · 해당 요건이 있으면 반드시 우선순위로 접수</text>
</svg>
