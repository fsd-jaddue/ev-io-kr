<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 314" width="800" height="314" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="314" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">같은 차(아이오닉 6 롱레인지, 국비 570)도 지역마다 다릅니다</text><text x="238" y="80" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">경북 울릉군</text><rect x="250" y="66" width="438.0952380952381" height="22" rx="6" fill="#059669"/><text x="696.0952380952381" y="80" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">1,235만원</text><text x="238" y="114" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">전남 완도군</text><rect x="250" y="100" width="389.49681897050317" height="22" rx="6" fill="#059669"/><text x="647.4968189705032" y="114" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">1,098만원</text><text x="238" y="148" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">충남 천안시</text><rect x="250" y="134" width="331.32060921534605" height="22" rx="6" fill="#34d399"/><text x="589.320609215346" y="148" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">934만원</text><text x="238" y="182" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">경기 성남시</text><rect x="250" y="168" width="266.0497397339503" height="22" rx="6" fill="#34d399"/><text x="524.0497397339502" y="182" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">750만원</text><text x="238" y="216" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">경기 파주시</text><rect x="250" y="202" width="264.6308077887025" height="22" rx="6" fill="#a7f3d0"/><text x="522.6308077887024" y="216" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">746만원</text><text x="238" y="250" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">서울 강남구</text><rect x="250" y="236" width="262.85714285714283" height="22" rx="6" fill="#a7f3d0"/><text x="520.8571428571429" y="250" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">741만원</text><text x="400" y="298" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">국비 570 + 지방비(최대액 × 570 ÷ 648 추정, 서울은 수집값) · 전환지원 국비 미포함 · 단위 만원</text>
</svg>
