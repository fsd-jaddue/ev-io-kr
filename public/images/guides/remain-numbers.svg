<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" width="800" height="234" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="234" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">지자체별 보조금 현황 표의 네 가지 숫자</text><rect x="40" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="62" width="168" height="6" rx="3" fill="#475569"/><text x="124" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">공고대수</text><text x="124" y="132" font-size="24" font-weight="800" fill="#475569" text-anchor="middle">1,000</text><text x="124" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">올해 지원하기로 공고한 총 대수</text><rect x="224" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="224" y="62" width="168" height="6" rx="3" fill="#2563eb"/><text x="308" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">접수대수</text><text x="308" y="132" font-size="24" font-weight="800" fill="#2563eb" text-anchor="middle">1,120</text><text x="308" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">신청서가 접수된 대수 (초과 = 대기)</text><rect x="408" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="408" y="62" width="168" height="6" rx="3" fill="#059669"/><text x="492" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">출고대수</text><text x="492" y="132" font-size="24" font-weight="800" fill="#059669" text-anchor="middle">860</text><text x="492" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">출고·등록 완료, 지급 확정</text><rect x="592" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="592" y="62" width="168" height="6" rx="3" fill="#f59e0b"/><text x="676" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">출고잔여대수</text><text x="676" y="132" font-size="24" font-weight="800" fill="#f59e0b" text-anchor="middle">140</text><text x="676" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">= 공고대수 − 출고대수</text><text x="400" y="218" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">예시 수치 · 접수가 공고를 넘었으면 잔여가 보여도 사실상 대기 순번</text>
</svg>
