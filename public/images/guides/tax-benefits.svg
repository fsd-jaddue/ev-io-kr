<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" width="800" height="234" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="234" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">보조금과 별도로 받는 2026년 전기차 세제 혜택</text><rect x="40" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="62" width="168" height="6" rx="3" fill="#059669"/><text x="124" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">취득세 감면</text><text x="124" y="132" font-size="24" font-weight="800" fill="#059669" text-anchor="middle">최대 140만원</text><text x="124" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">등록 시 자동 적용</text><rect x="224" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="224" y="62" width="168" height="6" rx="3" fill="#f59e0b"/><text x="308" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">개별소비세 감면</text><text x="308" y="132" font-size="24" font-weight="800" fill="#f59e0b" text-anchor="middle">최대 300만원</text><text x="308" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">+ 교육세 90만원, 가격 반영</text><rect x="408" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="408" y="62" width="168" height="6" rx="3" fill="#2563eb"/><text x="492" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">자동차세</text><text x="492" y="132" font-size="24" font-weight="800" fill="#2563eb" text-anchor="middle">연 13만원</text><text x="492" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">배기량 무관 정액</text><rect x="592" y="62" width="168" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="592" y="62" width="168" height="6" rx="3" fill="#7c3aed"/><text x="676" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">공채 매입</text><text x="676" y="132" font-size="24" font-weight="800" fill="#7c3aed" text-anchor="middle">면제·감면</text><text x="676" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">지자체별 20~50만원 효과</text><text x="400" y="218" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">취득세·개소세 감면은 일몰 조항이 있어 매년 연장 여부 확인</text>
</svg>
