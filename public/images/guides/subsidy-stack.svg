<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="420" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">전기차 보조금은 세 층으로 쌓입니다</text><rect x="60" y="256" width="360" height="64" rx="12" fill="#059669"/><text x="240" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">국비 (환경부)</text><text x="240" y="304" font-size="12" font-weight="400" fill="#ffffff" text-anchor="middle">중·대형 승용 최대 580만원 · 소형 530만원</text><text x="240" y="251" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">+</text><rect x="60" y="182" width="360" height="64" rx="12" fill="#34d399"/><text x="240" y="210" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">지방비 (시·군·구)</text><text x="240" y="230" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">서울 194만원 ~ 경북 울릉 1,224만원</text><text x="240" y="177" font-size="18" font-weight="700" fill="#64748b" text-anchor="middle">+</text><rect x="60" y="108" width="360" height="64" rx="12" fill="#fde68a"/><text x="240" y="136" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">전환지원금 · 추가 인센티브</text><text x="240" y="156" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">내연기관차 처분 +100만원, 다자녀·청년 등</text><rect x="470" y="118" width="290" height="212" rx="12" fill="#ffffff" stroke="#e2e8f0"/><text x="615" y="148" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">= 실제 차값에서 빠지는 금액</text><text x="615" y="176" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">예) 서울 + 아이오닉 6 롱레인지</text><text x="615" y="198" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">570 + 191 + 100 = 약 861만원</text><text x="615" y="220" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">예) 경북 울릉군 동일 차종</text><text x="615" y="242" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">570 + 1,203 + 100 = 약 1,873만원</text><text x="400" y="404" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">지방비는 차종 국비 비율에 비례 지급 · 2026년 기준</text>
</svg>
