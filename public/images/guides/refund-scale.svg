<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
<rect width="800" height="370" rx="16" fill="#f8fafc"/>
<text x="400" y="36" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">의무운행과 환수, 자주 혼동하는 네 가지</text><rect x="40" y="62" width="352" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="62" width="352" height="6" rx="3" fill="#0284c7"/><text x="216" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">의무운행기간</text><text x="216" y="132" font-size="24" font-weight="800" fill="#0284c7" text-anchor="middle">8년</text><text x="216" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">등록일부터 · 2026년 지침</text><rect x="408" y="62" width="352" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="408" y="62" width="352" height="6" rx="3" fill="#059669"/><text x="584" y="98" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">국내 매매·이전</text><text x="584" y="132" font-size="24" font-weight="800" fill="#059669" text-anchor="middle">승계</text><text x="584" y="158" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">매수인이 남은 의무 승계, 환수 없음</text><rect x="40" y="198" width="352" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="198" width="352" height="6" rx="3" fill="#e11d48"/><text x="216" y="234" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">수출·폐차 등 말소</text><text x="216" y="268" font-size="24" font-weight="800" fill="#e11d48" text-anchor="middle">환수</text><text x="216" y="294" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">운행기간별 회수요율표 적용</text><rect x="408" y="198" width="352" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="408" y="198" width="352" height="6" rx="3" fill="#2563eb"/><text x="584" y="234" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">재지원 제한</text><text x="584" y="268" font-size="24" font-weight="800" fill="#2563eb" text-anchor="middle">2년</text><text x="584" y="294" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">의무운행과 별개 규정 · 지자체별</text>
</svg>
